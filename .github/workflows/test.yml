name: Client pivot checks
on:
  pull_request:
    branches: [main]
  push:
    branches: ['pivot/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - uses: actions/upload-artifact@v4
        with:
          name: jahnoah-static-review
          path: dist
          retention-days: 14
