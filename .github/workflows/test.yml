name: Test static site
on:
  push:
    branches: ['test/astro-revision']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 scripts/verify-static.py
      - uses: actions/upload-artifact@v4
        with:
          name: jahnoah-static-review
          path: dist
          retention-days: 7
